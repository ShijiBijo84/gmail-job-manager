version: '3.8'

services:
  server:
    # For production, use pre-built image from registry
    image: ghcr.io/your-username/gmail-job-manager:latest
    container_name: server
    ports:
      - "4000:4000"
    env_file: .env.prod
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
